[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tossperf"
version = "0.1.0"
description = "Win/loss and realized P&L from Toss Securities order history"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tossperf = "tossperf.cli:main"

[tool.setuptools]
packages = ["tossperf"]
